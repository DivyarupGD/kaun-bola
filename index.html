<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>Kaun Bola?</title>
    <link rel="manifest" href="./manifest.webmanifest?v=kahoot-19" />
    <link rel="icon" href="./assets/mask.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=kahoot-19" />
  </head>
  <body>
    <div id="app" class="app-shell" aria-live="polite"></div>
    <script>
      (function cleanOldServiceWorker() {
        if (!("serviceWorker" in navigator)) return;

        Promise.all([
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          }),
          "caches" in window
            ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) {
                  return caches.delete(key);
                }));
              })
            : Promise.resolve()
        ]).then(function () {
          if (navigator.serviceWorker.controller && !sessionStorage.getItem("kaun-bola-sw-cleaned")) {
            sessionStorage.setItem("kaun-bola-sw-cleaned", "1");
            window.location.reload();
          }
        });
      })();
    </script>
    <script src="./firebase-config.js?v=kahoot-19"></script>
    <script type="module" src="./app.js?v=kahoot-19"></script>
  </body>
</html>
